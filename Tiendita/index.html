<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestión de componentes electrónicos">
    <title>ElectroShop | Gestión de Componentes</title>
    
    <!-- 1. Tipografía Moderna (Google Fonts: Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 2. Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 3. Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- 4. Estilos personalizados -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.1)!important;
        }
        .card-header {
            border-radius: 16px 16px 0 0 !important;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
            font-weight: 500;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0b5ed7 0%, #094a9e 100%);
        }
        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <!-- Ícono de CPU para temática electrónica -->
                <i class="bi bi-cpu me-2 text-warning"></i>
                ElectroShop <span class="badge bg-warning text-dark ms-1">v1.1</span>
            </a>
            <span class="navbar-text text-light d-none d-sm-block">
                Sistema de Inventario para Componentes Electrónicos
            </span>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container py-5">
        <div class="row g-4">
            
            <!-- Formulario de Registro -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header py-3">
                        <h5 class="mb-0 fw-bold text-primary">
                            <i class="bi bi-plus-circle me-2"></i>Registrar Componente
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="formProducto">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-medium">Nombre del Componente</label>
                                <div class="input-group">
                                    <!-- Ícono de placa base -->
                                    <span class="input-group-text bg-light"><i class="bi bi-motherboard"></i></span>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Arduino Uno R3" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label fw-medium">Precio Unitario ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-cash-coin"></i></span>
                                    <input type="number" step="0.5" min="0" class="form-control" id="precio" placeholder="Ej. 450.00" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="cantidad" class="form-label fw-medium">Cantidad en Stock</label>
                                <div class="input-group">
                                    <!-- Ícono de capas/pilas -->
                                    <span class="input-group-text bg-light"><i class="bi bi-layers"></i></span>
                                    <input type="number" min="0" class="form-control" id="cantidad" placeholder="Ej. 15" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">
                                <i class="bi bi-save me-2"></i> Guardar Componente
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Inventario -->
            <div class="col-lg-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-primary">
                            <i class="bi bi-box-seam me-2"></i>Inventario de Componentes
                        </h5>
                        <span class="badge bg-primary rounded-pill px-3 py-2" id="totalProductos">
                            <i class="bi bi-boxes me-1"></i> 0 componentes
                        </span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" class="ps-4">ID</th>
                                        <th scope="col">Componente</th>
                                        <th scope="col">Precio</th>
                                        <th scope="col">Stock</th>
                                        <th scope="col" class="text-end pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos">
                                    <!-- Las filas se cargan dinámicamente con JavaScript -->
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-5">
                                            <i class="bi bi-cpu fs-1 d-block mb-2"></i>
                                            Sincronizando con el servidor...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Pie de Página -->
    <footer class="text-center text-muted py-4 mt-4">
        <small>&copy; 2026 ElectroShop. Desarrollado con FastAPI y Bootstrap.</small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu lógica de JavaScript -->
    <script src="app.js"></script>
</body>
</html>
